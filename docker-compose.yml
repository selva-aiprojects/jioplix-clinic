services:
  db:
    image: postgres:16-alpine
    container_name: jioplix-db
    environment:
      POSTGRES_USER: jioplix
      POSTGRES_PASSWORD: jioplix
      POSTGRES_DB: jioplix
    ports:
      - "5432:5432"
    volumes:
      - .pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jioplix -d jioplix"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jioplix-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: jioplix-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: jioplix
      MINIO_ROOT_PASSWORD: jioplix-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - .minio-data:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: jioplix-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
